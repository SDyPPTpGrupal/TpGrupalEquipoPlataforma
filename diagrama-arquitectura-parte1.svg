<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 25px Arial, sans-serif; fill: #0f172a; }
      .small { font: 22px Arial, sans-serif; fill: #334155; }
      .box { stroke: #334155; stroke-width: 3; }
      .arrow { stroke: #334155; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 12 10; }
    </style>
  </defs>

  <rect width="1500" height="900" fill="#f8fafc"/>
  <text x="750" y="62" text-anchor="middle" class="title">Arquitectura: despliegue Java o Python</text>

  <rect x="55" y="310" width="230" height="150" rx="18" fill="#fef3c7" class="box"/>
  <text x="170" y="375" text-anchor="middle" class="label">USER</text>
  <text x="170" y="415" text-anchor="middle" class="small">persona usuaria</text>

  <rect x="350" y="295" width="260" height="180" rx="18" fill="#dbeafe" class="box"/>
  <text x="480" y="355" text-anchor="middle" class="label">TUNEL HTTP</text>
  <text x="480" y="400" text-anchor="middle" class="label">:8080</text>
  <text x="480" y="440" text-anchor="middle" class="small">entrada del servicio</text>
  <path d="M285 385 L345 385" class="arrow"/>

  <rect x="700" y="135" width="700" height="610" rx="24" fill="#e2e8f0" class="box"/>
  <text x="1050" y="190" text-anchor="middle" class="title">Servidor compartido / Docker</text>

  <rect x="755" y="235" width="220" height="160" rx="18" fill="#dcfce7" class="box"/>
  <text x="865" y="285" text-anchor="middle" class="label">ARCHIVO JAVA</text>
  <text x="865" y="330" text-anchor="middle" class="small">se copia por SSH</text>
  <text x="865" y="365" text-anchor="middle" class="small">:22222</text>

  <rect x="755" y="490" width="220" height="160" rx="18" fill="#ffedd5" class="box"/>
  <text x="865" y="540" text-anchor="middle" class="label">ARCHIVO PYTHON</text>
  <text x="865" y="585" text-anchor="middle" class="small">se copia por SSH</text>
  <text x="865" y="620" text-anchor="middle" class="small">:22222</text>

  <rect x="1030" y="315" width="300" height="260" rx="18" fill="#dbeafe" class="box"/>
  <text x="1180" y="375" text-anchor="middle" class="label">UN CONTENEDOR</text>
  <text x="1180" y="420" text-anchor="middle" class="small">corre Java o Python</text>
  <text x="1180" y="460" text-anchor="middle" class="small">servicio HTTP :8080</text>
  <text x="1180" y="500" text-anchor="middle" class="small">solo una opción activa</text>

  <path d="M975 315 L1020 390" class="arrow"/>
  <path d="M975 570 L1020 500" class="arrow"/>
  <text x="995" y="335" text-anchor="middle" class="small">copiar</text>
  <text x="995" y="550" text-anchor="middle" class="small">copiar</text>
  <path d="M610 385 L1020 445" class="arrow"/>

  <rect x="55" y="570" width="555" height="120" rx="18" fill="#f1f5f9" class="box"/>
  <text x="332" y="615" text-anchor="middle" class="small">Tunel SSH :22222</text>
  <text x="332" y="655" text-anchor="middle" class="small">para copiar el archivo elegido</text>
  <path d="M610 630 L745 570" class="arrow dashed"/>

  <text x="750" y="820" text-anchor="middle" class="label">Se copia Java o Python: no hay dos contenedores corriendo a la vez</text>
</svg>
